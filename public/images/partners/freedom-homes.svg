<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- FH geometric mark -->
  <!-- Roof/house peak -->
  <polygon points="160,18 220,65 100,65" fill="none" stroke="#2d5f99" stroke-width="7" stroke-linejoin="round"/>
  <!-- F vertical bar -->
  <rect x="100" y="65" width="10" height="80" fill="#2d5f99"/>
  <!-- F top horizontal -->
  <rect x="100" y="65" width="48" height="10" fill="#2d5f99"/>
  <!-- F middle horizontal -->
  <rect x="100" y="99" width="36" height="9" fill="#2d5f99"/>
  <!-- H left vertical -->
  <rect x="170" y="65" width="10" height="80" fill="#2d5f99"/>
  <!-- H right vertical -->
  <rect x="210" y="65" width="10" height="80" fill="#2d5f99"/>
  <!-- H crossbar -->
  <rect x="170" y="98" width="50" height="9" fill="#2d5f99"/>
  <!-- Small window in centre of roof -->
  <rect x="153" y="72" width="14" height="12" fill="#2d5f99"/>
  <!-- FREEDOM HOMES -->
  <text x="160" y="168" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#2d5f99" text-anchor="middle" letter-spacing="4">FREEDOM HOMES</text>
  <!-- ARCHITECTS -->
  <text x="160" y="187" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="12" fill="#5a6a7a" text-anchor="middle" letter-spacing="5">ARCHITECTS</text>
</svg>
