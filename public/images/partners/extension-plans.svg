<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#1c1c1c"/>
  <!-- EP monogram: geometric E and P sharing a top horizontal roof bar -->
  <!-- E shape -->
  <rect x="90" y="55" width="8" height="80" fill="white"/>
  <rect x="90" y="55" width="50" height="8" fill="white"/>
  <rect x="90" y="91" width="38" height="7" fill="white"/>
  <rect x="90" y="127" width="50" height="8" fill="white"/>
  <!-- P shape -->
  <rect x="160" y="55" width="8" height="80" fill="white"/>
  <rect x="160" y="55" width="44" height="8" fill="white"/>
  <rect x="196" y="55" width="8" height="44" fill="white"/>
  <rect x="160" y="95" width="44" height="8" fill="white"/>
  <!-- Roof diagonal over both letters -->
  <polygon points="90,55 175,20 260,55" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/>
  <!-- EXTENSION PLANS text -->
  <text x="200" y="172" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="15" fill="white" text-anchor="middle" letter-spacing="5">EXTENSION PLANS</text>
</svg>
